name: internal strategy refactor

on:
  push:
    branches:
      - fix/vip-sp2l-production-readiness

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, 'internal strategy refactor') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/vip-sp2l-production-readiness

      - name: Refactor proprietary strategy identifiers
        shell: bash
        run: |
          set -euo pipefail

          OLD_LOWER="$(printf '%s' 'c3AybA==' | base64 -d)"
          OLD_UPPER="$(printf '%s' 'U1AyTA==' | base64 -d)"
          OLD_MIXED="$(printf '%s' 'U3AybA==' | base64 -d)"
          NEW_LOWER="$(printf '%s' 'c3RyYXRlZ3ktYQ==' | base64 -d)"
          NEW_NAME="$(printf '%s' 'U3RyYXRlZ3lB' | base64 -d)"

          mapfile -t FILES < <(git ls-files | grep -i "$OLD_LOWER" | sort -r || true)
          for path in "${FILES[@]}"; do
            new_path="${path//$OLD_LOWER/$NEW_LOWER}"
            new_path="${new_path//$OLD_UPPER/$NEW_LOWER}"
            new_path="${new_path//$OLD_MIXED/$NEW_LOWER}"
            if [[ "$path" != "$new_path" ]]; then
              git mv "$path" "$new_path"
            fi
          done

          mapfile -t TEXT_FILES < <(
            {
              git grep -Il "$OLD_UPPER" || true
              git grep -Il "$OLD_MIXED" || true
              git grep -Il "$OLD_LOWER" || true
            } | sort -u
          )

          for file in "${TEXT_FILES[@]}"; do
            python3 - "$file" "$OLD_UPPER" "$OLD_MIXED" "$OLD_LOWER" "$NEW_NAME" "$NEW_LOWER" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          old_upper, old_mixed, old_lower = sys.argv[2:5]
          new_name, new_lower = sys.argv[5:7]

          text = path.read_text(encoding="utf-8")
          text = text.replace(old_upper, new_name)
          text = text.replace(old_mixed, new_name)
          text = text.replace(old_lower, new_lower)
          text = text.replace("/strategy-a", "/strategy")
          text = text.replace('"strategy-a"', '"strategy"')
          text = text.replace("'strategy-a'", "'strategy'")
          text = text.replace("/strategy-a", "/strategy")
          path.write_text(text, encoding="utf-8")
          PY
          done

          git config user.name "Waresh Gold"
          git config user.email "wareshgold@users.noreply.github.com"

          pnpm install --frozen-lockfile
          pnpm test
          pnpm exec tsc --noEmit

          git add -A
          git commit -m "internal strategy refactor"
          git push origin HEAD:fix/vip-sp2l-production-readiness

      - name: Remove one-time refactor workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Waresh Gold"
          git config user.email "wareshgold@users.noreply.github.com"
          rm -f .github/workflows/strategy-anonymization.yml
          git add -A
          git commit -m "internal strategy cleanup"
          git push origin HEAD:fix/vip-sp2l-production-readiness
