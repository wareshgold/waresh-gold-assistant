name: Internal strategy naming refactor

on:
  push:
    branches:
      - fix/vip-sp2l-production-readiness

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/vip-sp2l-production-readiness

      - name: Replace proprietary strategy naming
        shell: bash
        run: |
          set -euo pipefail

          # Replace the old strategy identifier in every tracked text file.
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            perl -0pi -e 's/SP2L/StrategyA/g; s/Sp2l/StrategyA/g; s/sp2l/strategy-a/g' "$file"
          done < <(git grep -Il -e 'SP2L' -e 'Sp2l' -e 'sp2l' || true)

          # Rename tracked paths after content replacement.
          while IFS= read -r old; do
            [ -n "$old" ] || continue
            new="$old"
            new="${new//SP2L/StrategyA}"
            new="${new//Sp2l/StrategyA}"
            new="${new//sp2l/strategy-a}"
            if [ "$old" != "$new" ]; then
              mkdir -p "$(dirname "$new")"
              git mv "$old" "$new"
            fi
          done < <(git ls-files | grep -i 'sp2l' | sort -r || true)

          # Remove this one-shot workflow so the repository does not retain the old name.
          git rm -f .github/workflows/internal-strategy-refactor.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "refactor(strategy): anonymize proprietary strategy naming"
          git push origin HEAD:fix/vip-sp2l-production-readiness
